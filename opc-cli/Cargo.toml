[package]
name = "opc-cli"
authors.workspace = true
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Interactive TUI for browsing, reading, and writing OPC DA tags on Windows"
license.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["opc", "cli", "tui", "windows"]
categories = ["command-line-utilities", "network-programming"]

[lints]
workspace = true

[dependencies]
opc-da-client = { path = "../opc-da-client" }
ratatui = "0.29.0"
crossterm = "0.28.1"
tokio = { workspace = true, features = ["full"] }
windows = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tracing-appender-localtime = "0.2.4"

[dev-dependencies]
opc-da-client = { path = "../opc-da-client", features = ["test-support"] }
mockall = "0.13.1"
