name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Lockfile is committed; fail if it would change.
  CARGO_INCREMENTAL: 0

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The repo ships a machine-specific MSVC linker path in .cargo/config.toml
      # (pinned to a local 14.41.34120 install). The GitHub runner has a different
      # MSVC version, so this absolute path would break linking. Remove it and let
      # rustup's MSVC toolchain discover link.exe via the runner's VS install.
      - name: Remove machine-specific linker config
        shell: bash
        run: rm -f .cargo/config.toml

      - name: Install Rust (stable, satisfies MSRV 1.93.1 / edition 2024)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: i686-pc-windows-msvc   # 32 位 sim——兼容只注册 32 位 CATID 的 OPC client

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      # The desktop frontend (ui/dist) is gitignored, but tauri::generate_context!()
      # embeds it at compile time. It must exist before clippy/test/build compile
      # opc-da-desktop, or the proc macro panics. Build the frontend first.
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: opc-da-desktop/ui/package-lock.json

      - name: Build desktop frontend (ui/dist is gitignored)
        working-directory: opc-da-desktop/ui
        run: |
          npm ci
          npm run build

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Unit tests
        # COM tests (com_guard / com_worker) spin up real CoInitializeEx(MTA)
        # apartments and worker threads. Run single-threaded so the per-test
        # apartments don't interleave and corrupt the heap on process exit
        # (observed on the Windows Server CI runner; clean locally on Win10/11).
        run: cargo test --workspace --locked -- --test-threads=1

      - name: Build opc-cli (TUI)
        run: cargo build --release --locked --bin opc-cli

      - name: Build opc-da-desktop (GUI)
        run: cargo build --release --locked -p opc-da-desktop

      - name: Upload opc-cli.exe
        uses: actions/upload-artifact@v4
        with:
          name: opc-cli-windows-x64
          path: target/release/opc-cli.exe
          if-no-files-found: error

      - name: Upload opc-da-desktop.exe
        uses: actions/upload-artifact@v4
        with:
          name: opc-da-desktop-windows-x64
          path: target/release/opc-da-desktop.exe
          if-no-files-found: error

      # OPC DA simulation server（对标 Matrikon.OPC.Simulation）。x64 + x86 两位宽：
      # 32 位 client（PsOPCClient/Prosys）连 64 位 sim 会因 System32\OPCProxy.dll 缺失跨位宽
      # marshaling 崩溃，故同时产 32 位 sim。详见 memory opc-da-server-cross-bitness-marshaling。
      - name: Build opc-da-server-sim (x64)
        run: cargo build --release --locked -p opc-da-server-sim

      - name: Build opc-da-server (x64)
        run: cargo build --release --locked -p opc-da-server

      - name: Build opc-da-server-sim 32-bit (x86)
        run: cargo build --release --locked -p opc-da-server-sim --target i686-pc-windows-msvc

      - name: Upload opc-da-server-sim (x64)
        uses: actions/upload-artifact@v4
        with:
          name: opc-da-server-sim-windows-x64
          path: target/release/opc-da-server-sim.exe
          if-no-files-found: error

      - name: Upload opc-da-server-sim (x86)
        uses: actions/upload-artifact@v4
        with:
          name: opc-da-server-sim-windows-x86
          path: target/i686-pc-windows-msvc/release/opc-da-server-sim.exe
          if-no-files-found: error

      - name: Upload opc-da-server (x64)
        uses: actions/upload-artifact@v4
        with:
          name: opc-da-server-windows-x64
          path: target/release/opc-da-server.exe
          if-no-files-found: error
