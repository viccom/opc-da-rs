name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Lockfile is committed; fail if it would change.
  CARGO_INCREMENTAL: 0

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The repo ships a machine-specific MSVC linker path in .cargo/config.toml
      # (pinned to a local 14.41.34120 install). The GitHub runner has a different
      # MSVC version, so this absolute path would break linking. Remove it and let
      # rustup's MSVC toolchain discover link.exe via the runner's VS install.
      - name: Remove machine-specific linker config
        shell: bash
        run: rm -f .cargo/config.toml

      - name: Install Rust (stable, satisfies MSRV 1.93.1 / edition 2024)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Unit tests
        run: cargo test --workspace --locked

      # ── Build portable Windows binaries (TUI + desktop GUI) ──
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: opc-da-desktop/ui/package-lock.json

      - name: Build desktop frontend (ui/dist is gitignored)
        working-directory: opc-da-desktop/ui
        run: |
          npm ci
          npm run build

      - name: Build opc-cli (TUI)
        run: cargo build --release --locked --bin opc-cli

      - name: Build opc-da-desktop (GUI)
        run: cargo build --release --locked -p opc-da-desktop

      - name: Upload opc-cli.exe
        uses: actions/upload-artifact@v4
        with:
          name: opc-cli-windows-x64
          path: target/release/opc-cli.exe
          if-no-files-found: error

      - name: Upload opc-da-desktop.exe
        uses: actions/upload-artifact@v4
        with:
          name: opc-da-desktop-windows-x64
          path: target/release/opc-da-desktop.exe
          if-no-files-found: error
