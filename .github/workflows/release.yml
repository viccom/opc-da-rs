name: Release

# Tag a version (e.g. v0.3.1) to build the Windows portable binaries and
# publish them as a GitHub Release. CI on push/PR already gates quality.
on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Remove machine-specific linker config
        shell: bash
        run: rm -f .cargo/config.toml

      - name: Install Rust (stable, satisfies MSRV 1.93.1 / edition 2024)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: opc-da-desktop/ui/package-lock.json

      - name: Build desktop frontend
        working-directory: opc-da-desktop/ui
        run: |
          npm ci
          npm run build

      - name: Build opc-cli (TUI)
        run: cargo build --release --locked --bin opc-cli

      - name: Build opc-da-desktop (GUI)
        run: cargo build --release --locked -p opc-da-desktop

      # 32-bit (i686) desktop build. The OPC DA servers (Matrikon/Kepware) often
      # register their CATID only in the 32-bit registry view, so a 32-bit client
      # can enumerate servers a 64-bit client cannot see.
      - name: Build opc-da-desktop 32-bit (GUI)
        run: cargo build --release --locked -p opc-da-desktop --target i686-pc-windows-msvc

      # OPC DA simulation server（对标 Matrikon.OPC.Simulation）。x64 + x86：32 位 OPC client
      # 连 64 位 sim 会跨位宽 marshaling 崩溃，故同时发 32 位。+ 库 opc-da-server（flat/hier）。
      - name: Build opc-da-server-sim (x64)
        run: cargo build --release --locked -p opc-da-server-sim

      - name: Build opc-da-server (x64)
        run: cargo build --release --locked -p opc-da-server

      - name: Build opc-da-server-sim 32-bit (x86)
        run: cargo build --release --locked -p opc-da-server-sim --target i686-pc-windows-msvc

      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p assets
          cp target/release/opc-cli.exe                                 assets/opc-cli-x64.exe
          cp target/release/opc-da-desktop.exe                          assets/opc-da-desktop-x64.exe
          cp target/i686-pc-windows-msvc/release/opc-da-desktop.exe     assets/opc-da-desktop-x86.exe
          cp target/release/opc-da-server-sim.exe                       assets/opc-da-server-sim-x64.exe
          cp target/i686-pc-windows-msvc/release/opc-da-server-sim.exe  assets/opc-da-server-sim-x86.exe
          cp target/release/opc-da-server.exe                           assets/opc-da-server-x64.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/opc-cli-x64.exe
            assets/opc-da-desktop-x64.exe
            assets/opc-da-desktop-x86.exe
            assets/opc-da-server-sim-x64.exe
            assets/opc-da-server-sim-x86.exe
            assets/opc-da-server-x64.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
