[package]
name = "opc-da-desktop"
authors.workspace = true
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Tauri 2.0 desktop GUI for browsing, subscribing, and visualizing OPC DA tags on Windows"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["opc", "opc-da", "tauri", "windows", "scada"]
categories = ["gui", "network-programming"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
opc-da-client = { path = "../opc-da-client" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tracing-appender-localtime = "0.2.4"
thiserror = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[dev-dependencies]
opc-da-client = { path = "../opc-da-client", features = ["test-support"] }
mockall = "0.13.1"

# This crate is Windows-only at runtime (depends on opc-da-client which uses COM/DCOM).
# The library provides an empty stub on non-Windows so `cargo check --workspace`
# succeeds on Linux CI.

[features]
default = ["opc-da-backend"]
opc-da-backend = []
test-support = ["opc-da-client/test-support"]

[[bin]]
name = "opc-da-desktop"
path = "src/main.rs"

[lib]
name = "opc_da_desktop"
path = "src/lib.rs"