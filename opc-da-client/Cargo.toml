[package]
name = "opc-da-client"
authors.workspace = true
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
description = "Backend-agnostic OPC DA client library for Rust — async, trait-based, with transparent COM management"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["opc", "opc-da", "windows", "automation", "scada"]
categories = ["api-bindings", "network-programming"]
exclude = [
    ".winmd/",
    "architecture.md",
    "spec.md",
    "rewrite.py",
]

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[lints]
workspace = true

[features]
default = ["opc-da-backend"]
opc-da-backend = []
test-support = ["dep:mockall"]
# End-to-end tests against a real OPC DA server (Matrikon/Kepware). See tests/e2e.rs.
e2e = ["opc-da-backend"]

[dependencies]
# Core (always included)
anyhow = { workspace = true }
async-trait = "0.1.86"
chrono = "0.4.43"
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
# OS: Windows (required)
windows = { workspace = true }
windows-core = { workspace = true }

# Test support: mock provider (optional)
mockall = { version = "0.13.1", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
